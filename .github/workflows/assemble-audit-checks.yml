name: Assemble audit-checks
on:
  push:
    paths:
      - ".claude/skills/seoagent/references/_assemble/READY"
jobs:
  assemble:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Assemble audit-checks.md
        run: |
          set -euo pipefail
          dest=".claude/skills/seoagent/references/audit-checks.md"
          mkdir -p "$(dirname "$dest")"
          cat .claude/skills/seoagent/references/_assemble/audit-checks.*.b64 | base64 -d > "$dest"
          # sanity check size
          test "$(wc -c < "$dest")" -gt 40000
          rm -rf .claude/skills/seoagent/references/_assemble
          rm -f .github/workflows/assemble-audit-checks.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status
          git commit -m "Add SEOAgent skill SKILL.md and references"
          git push
