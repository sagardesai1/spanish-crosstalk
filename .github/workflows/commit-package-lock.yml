name: Commit package-lock
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/commit-package-lock.yml"
      - "package.json"
jobs:
  lock:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Regenerate package-lock.json from package.json
        run: npm install --package-lock-only
      - name: Commit package-lock.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "No lockfile changes"
          else
            git commit -m "Add SEOAgent blog publishing and beginner Spanish pillar post (package-lock)"
            git push
          fi
