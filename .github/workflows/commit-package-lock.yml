name: Commit package-lock
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/commit-package-lock.yml"
      - "package-lock.parts/**"
      - "package.json"
jobs:
  lock:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Assemble lockfile from parts if present
        run: |
          if [ -d package-lock.parts ] && ls package-lock.parts/*.txt >/dev/null 2>&1; then
            cat package-lock.parts/*.txt > package-lock.json
            echo "Assembled from parts"
          else
            echo "No parts; will generate"
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Generate lockfile if missing or invalid
        run: |
          if ! node -e "const l=require('./package-lock.json'); if(!l.packages || !Object.keys(l.packages).length) process.exit(1)"; then
            npm install --package-lock-only
          fi
      - name: Commit package-lock.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "No lockfile changes"
          else
            git commit -m "Add package-lock.json for reproducible Vercel installs"
            git push
          fi
