name: restore-conversation
on:
  push:
    paths:
      - ".restore/**"
      - ".github/workflows/restore-conversation.yml"
  workflow_dispatch:
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Assemble Conversation.tsx and remove split
        run: |
          set -euo pipefail
          cat .restore/part0.b64 .restore/part1.b64 .restore/part2.b64 .restore/part3.b64 .restore/part4.b64 .restore/part5.b64 | base64 -d > components/Conversation.tsx
          rm -f components/Conversation.full.tsx
          rm -rf .restore
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Restore Conversation.tsx and remove Conversation.full split" || exit 0
          git push
