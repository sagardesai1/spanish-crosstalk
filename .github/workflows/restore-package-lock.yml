name: Restore package-lock
on:
  push:
    paths:
      - ".lock-restore/**"
      - ".github/workflows/restore-package-lock.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble package-lock.json
        run: |
          set -euo pipefail
          cat .lock-restore/part.* | base64 -d | gunzip > package-lock.json
          python3 -c "import json; json.load(open('package-lock.json')); print('lockfile ok')"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Add Google Analytics and Tag Manager via env vars"
          git push
